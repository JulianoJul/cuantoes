# Keep the Android release build bounded on this 8 GiB / no-swap machine.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Use AGP's built-in Kotlin compiler instead of the legacy Kotlin Gradle Plugin.
android.builtInKotlin=true
